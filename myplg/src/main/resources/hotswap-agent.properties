# HotSwapAgent Configuration for Minecraft Plugin Development

# Automatic hot deploy for class changes
autoHotswap=true

# Extra classpath for the agent to watch
extraClasspath=${project.projectDir}/build/classes/java/main

# Disable plugins we don't need
disabledPlugins=Hibernate,Spring,JBossModules,Seam,ELResolver,OsgiEquinox,Owb,WebObjects,Weld,CxfJAXRS,RestEasy,Jersey2,MyFaces

# Watch for resource changes
watchResources=src/main/resources

# Logging
LOGGER.org.hotswap.agent=INFO
